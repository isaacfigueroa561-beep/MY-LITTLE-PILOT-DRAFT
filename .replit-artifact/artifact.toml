kind = "web"
previewPath = "/"
title = "Little Pilot"
version = "1.0.0"
id = "artifacts/little-pilot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25025

[services.development]
run = "pnpm --filter @workspace/little-pilot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/little-pilot", "run", "build" ]
publicDir = "artifacts/little-pilot/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25025"
BASE_PATH = "/"
